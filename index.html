:root {
  --bg: #0f0e0b;
  --surface: #1a1910;
  --surface2: #222115;
  --border: #2e2c1a;
  --gold: #c8a84b;
  --gold-dim: #8a6e2a;
  --text: #e8e0cc;
  --text-dim: #8a7d60;
  --text-muted: #4a4530;
  --red: #8b2e2e;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif TC', Georgia, serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overscroll-behavior: none;
}

/* HEADER */
.header {
  background: linear-gradient(180deg, #181710 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
  padding: 48px 20px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  max-width: 520px;
  margin: 0 auto 16px;
}
.header-label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.header-title {
  font-size: 24px;
  font-weight: 900;
  color: #f0e6c0;
}
.week-badge {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 18px;
  text-align: center;
}
.week-count {
  font-size: 30px;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
}
.week-label {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 0.1em;
}

/* WEEK BAR */
.week-bar {
  display: flex;
  gap: 6px;
  max-width: 520px;
  margin: 0 auto;
}
.week-day {
  flex: 1;
  text-align: center;
  padding: 6px 2px;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: all 0.2s;
}
.week-day.today {
  background: #2a2510;
  border-color: var(--gold);
}
.week-day-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.week-day.today .week-day-label { color: var(--gold); }
.week-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin: 0 auto;
  background: #1e1d10;
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.week-dot.fed { background: var(--gold); border: none; }

/* BODY */
.body {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 20px 120px;
}

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 80px 0;
  color: var(--text-muted);
}
.empty-icon { font-size: 52px; margin-bottom: 16px; }
.empty-title { font-size: 15px; margin-bottom: 8px; }
.empty-sub { font-size: 12px; }

/* DATE GROUP */
.date-group { margin-bottom: 28px; }
.date-header {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  padding-bottom: 10px;
  border-bottom: 1px solid #221f10;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-count {
  color: var(--text-muted);
  font-size: 9px;
}

/* RECORD CARD */
.record-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
  animation: slideIn 0.2s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.record-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: #222115;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.record-body { flex: 1; min-width: 0; }
.record-top {
  display: flex; align-items: center; gap: 8px; margin-bottom: 3px;
}
.record-food { font-weight: 700; font-size: 15px; color: #f0e6c0; }
.record-time { font-size: 11px; color: var(--text-muted); }
.record-note { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
.record-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.btn-delete {
  background: transparent; border: none;
  color: var(--text-muted); cursor: pointer;
  font-size: 18px; padding: 2px 6px; line-height: 1;
  transition: color 0.15s;
}
.btn-delete:hover { color: var(--red); }
.btn-confirm {
  padding: 4px 10px; border-radius: 6px; font-size: 11px;
  border: none; background: var(--red);
  color: #f0e6c0; cursor: pointer; font-family: inherit;
}
.btn-cancel {
  padding: 4px 10px; border-radius: 6px; font-size: 11px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); cursor: pointer; font-family: inherit;
}

/* FORM */
.form-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  animation: slideIn 0.2s ease;
}
.form-title {
  font-size: 12px; color: var(--text-dim);
  letter-spacing: 0.1em; margin-bottom: 16px;
}
.form-label {
  display: block; font-size: 10px;
  color: var(--text-muted); letter-spacing: 0.15em;
  margin-bottom: 7px; text-transform: uppercase;
}
.form-input {
  width: 100%;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 9px; color: var(--text);
  padding: 9px 12px; font-size: 14px;
  margin-bottom: 16px; outline: none;
  font-family: inherit;
  transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--gold-dim); }
textarea.form-input { resize: none; }
input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0.4); }

.food-chips {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
}
.food-chip {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text-dim); cursor: pointer;
  transition: all 0.15s; font-family: inherit;
}
.food-chip.active {
  border-color: var(--gold); background: #2a2510; color: var(--gold);
}

.form-buttons { display: flex; gap: 10px; }
.btn-cancel-form {
  flex: 1; padding: 11px; border-radius: 10px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); cursor: pointer;
  font-family: inherit; font-size: 14px;
}
.btn-save {
  flex: 2; padding: 11px; border-radius: 10px;
  border: none; background: var(--gold);
  color: #0f0e0b; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 700;
  transition: opacity 0.15s;
}
.btn-save:active { opacity: 0.9; }

/* FAB */
.fab {
  position: fixed;
  bottom: 32px; left: 50%; transform: translateX(-50%);
  z-index: 200;
}
.fab button {
  background: var(--gold);
  color: #0f0e0b;
  border: none; border-radius: 50px;
  padding: 15px 34px;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 5px rgba(0,0,0,0.3), 0 6px 20px rgba(200,168,75,0.35);
  display: flex; align-items: center; gap: 8px;
  font-family: inherit;
  transition: box-shadow 0.28s cubic-bezier(0.4,0,0.2,1), transform 0.18s cubic-bezier(0.4,0,0.2,1);
  position: relative; overflow: hidden;
}
.fab button:active {
  box-shadow: 0 8px 20px rgba(0,0,0,0.35), 0 10px 28px rgba(200,168,75,0.4);
  transform: translateY(-2px);
}

/* Material Ripple */
.ripple-wrap {
  position: relative;
  overflow: hidden;
  transform: translateZ(0);
}
.ripple-wrap::after {
  content: '';
  display: block;
  position: absolute;
  width: 100%; height: 100%;
  top: 0; left: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, rgba(255,255,255,0.25) 10%, transparent 10%);
  background-repeat: no-repeat;
  background-position: 50%;
  transform: scale(10); opacity: 0;
  transition: transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.8s cubic-bezier(0.4,0,0.2,1);
}
.ripple-wrap:active::after {
  transform: scale(0); opacity: 0.3;
  transition: 0s;
}
.ripple-dark::after {
  background-image: radial-gradient(circle, rgba(0,0,0,0.18) 10%, transparent 10%);
}

/* Material elevation on cards */
.record-card {
  transition: box-shadow 0.28s cubic-bezier(0.4,0,0.2,1);
}
.record-card:active {
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

/* Form slide up - Material style */
@keyframes materialSlideUp {
  0%   { opacity: 0; transform: translateY(24px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes materialFadeIn {
  0%   { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}
.form-panel {
  animation: materialSlideUp 0.35s cubic-bezier(0.4,0,0.2,1) forwards;
}
.record-card {
  animation: materialFadeIn 0.25s cubic-bezier(0.4,0,0.2,1) forwards;
}

/* Material button press */
.mat-btn {
  transition: background 0.2s cubic-bezier(0.4,0,0.2,1),
              box-shadow 0.2s cubic-bezier(0.4,0,0.2,1),
              transform 0.15s cubic-bezier(0.4,0,0.2,1);
}
.mat-btn:active {
  transform: scale(0.96);
}

/* Food chip transition */
.food-chip {
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  position: relative; overflow: hidden;
}
.food-chip:active { transform: scale(0.94); }

<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-label">螞蟻飼育日誌</div>
      <div class="header-title">🐜 餵食紀錄</div>
    </div>
    <div class="week-badge">
      <div class="week-count" id="weekCount">0</div>
      <div class="week-label">本週次數</div>
    </div>
  </div>
  <div class="week-bar" id="weekBar"></div>
</div>

<div class="body">
  <div id="formContainer"></div>
  <div id="recordList"></div>
</div>

<div class="fab" id="fab">
  <button class="ripple-dark" onclick="openForm()">＋ 記錄餵食</button>
</div>

<script>
const FOOD_OPTIONS = ["蟋蟀", "麵包蟲", "果凍", "蜂蜜水", "昆蟲果凍", "蛋白質飼料", "其他"];
const STORAGE_KEY = "ant_feeding_records_v2";

let records = [];
let selectedFood = FOOD_OPTIONS[0];
let pendingDelete = null;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    records = raw ? JSON.parse(raw) : [];
  } catch { records = []; }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function getWeekStart() {
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const d = new Date(now);
  d.setDate(now.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "short" });
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
}

function nowLocalISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderWeekBar() {
  const bar = document.getElementById("weekBar");
  const labels = ["一","二","三","四","五","六","日"];
  const dows = [1,2,3,4,5,6,0];
  const now = new Date();
  const weekStart = getWeekStart();
  const weekRecords = records.filter(r => new Date(r.time) >= weekStart);

  document.getElementById("weekCount").textContent = weekRecords.length;

  bar.innerHTML = dows.map((dow, i) => {
    const todayDow = now.getDay();
    const diff = dow - todayDow;
    const d = new Date(now);
    d.setDate(now.getDate() + diff);
    d.setHours(0,0,0,0);
    const isToday = d.toDateString() === now.toDateString();
    const hasFed = weekRecords.some(r => {
      const rd = new Date(r.time);
      rd.setHours(0,0,0,0);
      return rd.toDateString() === d.toDateString();
    });
    return `<div class="week-day ${isToday ? 'today' : ''}">
      <div class="week-day-label">${labels[i]}</div>
      <div class="week-dot ${hasFed ? 'fed' : ''}"></div>
    </div>`;
  }).join("");
}

function renderRecords() {
  const list = document.getElementById("recordList");
  if (records.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">🐜</div>
      <div class="empty-title">還沒有紀錄</div>
      <div class="empty-sub">點擊下方按鈕開始記錄</div>
    </div>`;
    return;
  }

  const grouped = {};
  records.forEach(r => {
    const key = new Date(r.time).toDateString();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  });

  const sortedKeys = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

  list.innerHTML = sortedKeys.map(key => {
    const dayRecords = grouped[key];
    const cards = dayRecords.map(r => {
      const isDeleting = pendingDelete === r.id;
      return `<div class="record-card" id="card-${r.id}">
        <div class="record-icon">🍽️</div>
        <div class="record-body">
          <div class="record-top">
            <span class="record-food">${r.food}</span>
            <span class="record-time">${formatTime(r.time)}</span>
          </div>
          ${r.note ? `<div class="record-note">${r.note}</div>` : ""}
        </div>
        <div class="record-actions">
          ${isDeleting
            ? `<button class="btn-cancel mat-btn ripple-wrap" onclick="cancelDelete()">取消</button>
               <button class="btn-confirm mat-btn ripple-wrap" onclick="confirmDelete(${r.id})">確認</button>`
            : `<button class="btn-delete mat-btn ripple-wrap" onclick="askDelete(${r.id})">×</button>`
          }
        </div>
      </div>`;
    }).join("");

    return `<div class="date-group">
      <div class="date-header">
        ${formatDate(new Date(key).toISOString())}
        <span class="date-count">(${dayRecords.length} 次)</span>
      </div>
      ${cards}
    </div>`;
  }).join("");
}

function render() {
  renderWeekBar();
  renderRecords();
}

function openForm() {
  selectedFood = FOOD_OPTIONS[0];
  document.getElementById("fab").style.display = "none";
  document.getElementById("formContainer").innerHTML = buildForm();
}

function buildForm() {
  const chips = FOOD_OPTIONS.map(f =>
    `<button class="food-chip ripple-wrap ${f === selectedFood ? 'active' : ''}" onclick="selectFood('${f}')">${f}</button>`
  ).join("");

  return `<div class="form-panel">
    <div class="form-title">新增餵食紀錄</div>

    <label class="form-label">餵食時間</label>
    <input class="form-input" type="datetime-local" id="feedTime" value="${nowLocalISO()}">

    <label class="form-label">食物種類</label>
    <div class="food-chips" id="foodChips">${chips}</div>

    <div id="customFoodWrap" style="display:${selectedFood==='其他'?'block':'none'}">
      <input class="form-input" id="customFood" placeholder="請輸入食物名稱...">
    </div>

    <label class="form-label">備註 / 觀察</label>
    <textarea class="form-input" id="feedNote" rows="3" placeholder="例如：工蟻反應積極、蟻后出現..."></textarea>

```
<div class="form-buttons">
  <button class="btn-cancel-form mat-btn ripple-wrap" onclick="closeForm()">取消</button>
  <button class="btn-save mat-btn ripple-wrap ripple-dark" onclick="addRecord()">儲存紀錄</button>
</div>
```

  </div>`;
}

function selectFood(food) {
selectedFood = food;
document.getElementById(“formContainer”).innerHTML = buildForm();
// restore values
}

function closeForm() {
document.getElementById(“formContainer”).innerHTML = “”;
document.getElementById(“fab”).style.display = “block”;
}

function addRecord() {
const timeVal = document.getElementById(“feedTime”).value;
const noteVal = document.getElementById(“feedNote”).value.trim();
let foodVal = selectedFood;
if (selectedFood === “其他”) {
const custom = document.getElementById(“customFood”).value.trim();
foodVal = custom || “其他”;
}

const record = {
id: Date.now(),
time: timeVal ? new Date(timeVal).toISOString() : new Date().toISOString(),
food: foodVal,
note: noteVal,
};

records.unshift(record);
save();
closeForm();
render();
}

function askDelete(id) {
pendingDelete = id;
renderRecords();
}

function cancelDelete() {
pendingDelete = null;
renderRecords();
}

function confirmDelete(id) {
records = records.filter(r => r.id !== id);
save();
pendingDelete = null;
render();
}

// init
load();
render();
</script>

</body>
</html>
